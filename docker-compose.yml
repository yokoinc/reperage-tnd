services:
  tnd:
    # image non privilégiée : nginx tourne en UID 101, pas en root
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: tnd-reperage
    restart: unless-stopped

    # Écoute sur l'hôte, définie dans .env -> port 8080 dans le conteneur.
    # Par défaut 127.0.0.1 : rien n'est joignable depuis le réseau, l'accès
    # extérieur passe obligatoirement par le reverse proxy de l'hôte (HTTPS).
    # Si le reverse proxy est un conteneur, commenter ces deux lignes.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8791}:8080"

    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    # durcissement : système de fichiers en lecture seule, aucune capacité,
    # pas d'escalade de privilèges possible
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=8m
      - /var/cache/nginx:size=8m

    # garde-fous de ressources : un fichier statique n'a besoin de rien
    mem_limit: 64m
    pids_limit: 64

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
