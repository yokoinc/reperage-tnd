server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # --- journalisation ---------------------------------------------------
    # Les logs d'accès enregistrent l'adresse IP des visiteurs (donnée
    # personnelle). Ils sont conservés ici, avec rotation via docker-compose.
    # Pour ne rien journaliser du tout : remplacer par "access_log off;"
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # --- en-têtes de sécurité --------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-Frame-Options          "DENY"                          always;
    add_header Referrer-Policy          "no-referrer"                   always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Ne pas indexer : cet outil n'est pas le site officiel, il ne doit pas
    # remonter dans les moteurs de recherche à la place de handicap.gouv.fr
    add_header X-Robots-Tag             "noindex, nofollow, noarchive"  always;

    # La page est 100 % autonome : styles et scripts en ligne, aucune
    # ressource externe, aucune requête réseau. La CSP verrouille exactement ça.
    add_header Content-Security-Policy
        "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Pas de cache : la grille peut être corrigée, on veut la version du jour.
    # Attention nginx : tous les add_header doivent rester au même niveau.
    # Un seul add_header dans un bloc location annulerait TOUS ceux hérités ici.
    add_header Cache-Control "no-store, must-revalidate" always;

    # --- méthodes autorisées ---------------------------------------------
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # --- compression ------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/html text/plain text/css application/javascript;

    # --- sonde de santé ---------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # --- contenu ----------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}
